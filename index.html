<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Article Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #result {
            margin-top: 25px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>AI Article Generator</h1>

    <input
        id="topic"
        type="text"
        placeholder="Enter article topic"
    >

    <button id="generateBtn" onclick="generateArticle()">
        Generate
    </button>

    <div id="result"></div>

    <script>
        const WEBHOOK_URL = "YOUR_N8N_WEBHOOK_URL";

        async function generateArticle() {

            const topic = document.getElementById("topic").value.trim();
            const result = document.getElementById("result");
            const button = document.getElementById("generateBtn");

            if (!topic) {
                result.textContent = "Please enter an article topic.";
                return;
            }

            if (WEBHOOK_URL === "YOUR_N8N_WEBHOOK_URL") {
                result.textContent =
                    "Please configure an active n8n webhook URL to generate articles.";
                return;
            }

            button.disabled = true;
            result.textContent = "Generating article...";

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        topic: topic
                    })
                });

                if (!response.ok) {
                    throw new Error("Unable to generate article.");
                }

                const data = await response.text();
                result.textContent = data;

            } catch (error) {
                result.textContent =
                    "Something went wrong. Please check your webhook connection.";
            } finally {
                button.disabled = false;
            }
        }
    </script>

</body>
</html>
